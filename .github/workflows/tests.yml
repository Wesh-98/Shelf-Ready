name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    # ShelfReady is a Windows desktop app; test on the platform it ships for.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        # These import only stdlib plus shelfready_ui, so they need no display.
        run: python -m unittest discover -s tests -v

      - name: Import smoke test
        # Catches a numpy/scipy/Pillow break that the pure-logic tests miss.
        run: |
          python -c "import image_toolkit; print('image_toolkit ok')"
          python -c "from shelfready_ui import assets, presets, runner, settings, theme; print('shelfready_ui ok')"

      - name: End-to-end CLI run
        # Builds its own fixture rather than committing product photography:
        # a coloured product on a coloured ground, so the run exercises
        # background removal and canvas placement for real.
        run: |
          python -c "from PIL import Image, ImageDraw; im = Image.new('RGB', (800, 800), (40, 90, 200)); d = ImageDraw.Draw(im); d.rectangle([250, 200, 550, 600], fill=(220, 60, 50)); d.ellipse([300, 250, 500, 400], fill=(250, 230, 40)); im.save('fixture.jpg', quality=95)"
          python image_toolkit.py --in fixture.jpg --out out.jpg --op both --size 1500
          python -c "import sys; from PIL import Image; im = Image.open('out.jpg'); print('output', im.size); sys.exit(0 if im.size == (1500, 1500) else 'unexpected canvas size')"
